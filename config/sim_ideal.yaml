# stanley_dynamics_sim.launch.py ideal:=true - in place of sim_overrides.yaml:
# the pre-2026-09-23 ideal simulation. The simulator's pose is exact from the
# start and publishes no /ekf/heading_verified, so the heading gate is off;
# the steering feedback watchdog and the lead limit are off as well.
route_publisher_node:
  ros__parameters:
    goal_mode: "STOP_AT_END"
stanley_node:
  ros__parameters:
    steering_feedback_topic: "/simulation/encoder"
    heading_verified_required: false
    map_heading_consistency_required: false
    steering_feedback_required: false
    max_steering_command_lead_deg: 0.0
    max_steering_command_lead_curve_deg: 0.0
